name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `prepare` installs git hooks, which CI has no use for.
      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: medusa
      DB_PASSWORD: medusa
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --ignore-scripts
      # Boots a real Medusa app from this repo (medusa-config.ts) against a
      # mocked Packeta API — see integration-tests/.
      - run: bun run test:integration
